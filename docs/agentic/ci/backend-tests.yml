name: backend-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps (mirrors setup.sh)
        working-directory: ultrabot-web/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -r requirements-fyers.txt
          pip install -r requirements-fyers-extra.txt
      - name: Import check
        working-directory: ultrabot-web/backend
        run: python -c "import fyers_apiv3; import app"
      - name: Test suite
        working-directory: ultrabot-web/backend
        run: python -m pytest tests/ -q --tb=short

  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

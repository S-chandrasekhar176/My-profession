  kelly_min_fraction: 0.02
  kelly_max_fraction: 0.08
  # v0.4.6: restored to the pristine v0.4.1 value 1.0 (was polluted to 1.5 —
  # see risk.hard_risk_pct note). Kept in lockstep with risk.hard_risk_pct
  # by Settings._enforce_hard_risk_sync(); risk is the canonical section.
  hard_risk_pct: 1.0
  confidence_tiers:
    high:
      min: 0.8
      multiplier: 1.0
    medium:
      min: 0.6
      multiplier: 0.8
    low:
      min: 0.4
      multiplier: 0.5
  volatility_tiers:
    calm:
      max_vix: 14
      multiplier: 1.0
    normal:
      max_vix: 18
      multiplier: 0.85
    nervous:
      max_vix: 22
      multiplier: 0.65
    fearful:
      max_vix: 999
      multiplier: 0.4
  drawdown_tiers:
    profit:
      min_pct: 0
      multiplier: 1.0
    small_loss:
      min_pct: -1
      multiplier: 0.9
    mod_loss:
      min_pct: -2
      multiplier: 0.7
    big_loss:
      min_pct: -3
      multiplier: 0.4

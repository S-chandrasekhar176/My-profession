app:
  name: UltraBot Web
  version: 1.0.0
  secret_key: change-me-in-production
  host: 127.0.0.1
  port: 8000
auth:
  username: admin
  password_hash: $2b$12$Wb5rmUCZlzToN7WVIzbJX.409papQngxfB/vb7LjQdUumBzErPbhG
engine:
  scan_interval_seconds: 180
  # v0.4.2 (P1): scan cadence used when the active candle feed is realtime
  # (Fyers 1m). Falls back to 180s automatically on Yahoo failover.
  scan_interval_realtime_seconds: 60
  max_scan_retries: 3
  auto_squareoff_time: '15:15'
  auto_start: true
market:
  nse_open: 09:15
  nse_close: '15:30'
  pre_market_start: 09:00
  post_market_end: '16:00'
  auto_squareoff_time: '15:15'
  timezone: Asia/Kolkata
capital:
  virtual_capital: 500000
  max_capital_usage_pct: 90
  min_position_size: 5000
  # v0.4.2: restored to the pristine 25% — a risk-limits save had leaked a
  # 10% cross-write into this capital-owned setting (the config-hygiene
  # incident; the risk route is now section-ownership-fixed). This section is
  # owned exclusively by the Capital tab / PUT /api/settings.
  max_per_position_pct: 25.0
  # v0.4.2: ON per user's explicit request (P0.5) — each trading day starts
  # from the previous day's ending capital; falls back to virtual_capital.
  carry_forward_capital: true
risk:
  max_open_positions: 3
  max_per_sector: 2
  max_sector_concentration_pct: 40.0
  max_daily_trades: 10
  max_daily_loss_pct: 3
  max_consecutive_losses: 5
  consec_loss_cooloff_minutes: 30
  # v0.4.6: restored to the pristine v0.4.1 value 20 — a test payload
  # (vix_high_threshold: 22.0) polluted this key during the v0.4.2 session's
  # dual-singleton debugging, silently loosening G7's VIX block from 20 to 22.
  vix_threshold: 20
  # Hard block level — extreme market panic (G7); must stay > vix_threshold
  vix_extreme_threshold: 35.0
  vix_staleness_warning_seconds: 360
  vix_staleness_critical_seconds: 540
  vix_stale_floor: 22.0
  stale_candle_max_age_minutes: 30
  new_trade_window_start: 09:30
  new_trade_window_end: '15:15'
  auto_squareoff_time: '15:15'
  price_mismatch_threshold_pct: 0.5
  min_signal_confidence: 0.6
  max_drawdown_pct: 5
  opportunity_ttl_seconds: 300
  strategy_ttl_seconds:
    ORB: 180
    MB: 180
    TRS: 180
    MRF: 360
    PTC: 360
    SIC: 360
    VC: 420
  nifty_sanity_min: 10000
  nifty_sanity_max: 40000
  banknifty_sanity_min: 25000
  banknifty_sanity_max: 100000
  max_fee_pct_of_risk: 30.0
  # v0.4.9 wave-4: G19 fee-aware minimum-move gate. Complements G17
  # (cost vs RISK) by checking cost vs REWARD: a signal whose gross target
  # move is below min_move_fee_multiple × round-trip costs needs an
  # outsized move just to net pocket change after fees.
  #   g19_mode: log_only (DEFAULT — never blocks; [G19 SHADOW] verdicts in
  #             the gate log build the enforcement evidence base),
  #             enforce (blocks below-multiple signals), off (skipped).
  # Flip to enforce ONLY after reviewing shadow verdicts against real
  # outcomes across enough live days.
  g19_mode: log_only
  min_move_fee_multiple: 2.0
  # v0.4.6: restored to the pristine v0.4.1 value 1.0 — a test payload
  # (hard_risk_pct: 1.5) leaked into the shipped file during the v0.4.2
  # session, silently loosening the hard per-trade risk floor by 50% (user
  # caught it: entry 100 / SL 50 / ₹5L capital sized 150 shares = ₹7,500
  # risk where the documented 1% budget allows 100 = ₹5,000).
  # Risk budget used by G17 to ESTIMATE quantity before the sizer runs
  # (mirrors position_sizing.hard_risk_pct; the gate runs pre-sizing).
  hard_risk_pct: 1.0
  per_strategy_daily_loss_pct: 1.0
  per_strategy_daily_loss_overrides:
    MRF: 0.75
    TRS: 0.5
  per_strategy_consec_loss_limit: 2
  per_strategy_consec_loss_cooldown_minutes: 240
  time_stop_minutes:
    default: 90
    PTC: 75
    MB: 45
    MRF: 60
    VC: 60
    SIC: 30
    ORB: 90
    TRS: 90
  fail_fast:
    window_minutes: 15
    atr_mult:
      MB: 0.75
      VC: 0.75
  shadow_signal_max_age_minutes: 90
# v0.4.2 (P2): all 14 dormant strategies + TRS shadow-tracked every scan —
# signals recorded, never traded; feeds GET /api/strategies/verdicts.
strategy_shadow_mode:
- TRS
- AdaptiveSupertrend
- Breakout
- GapFill
- MeanReversion
- Momentum
- MultiTimeframe
- NewsMomentum
- ORBVolume
- ORB_Classic
- RSIDivergence
- SectorRotation
- Supertrend
- TrendExhaustion
- VWAPReversion
# v0.4.2 (P2): realistic paper fills — ~5bps half-spread + size impact.
paper_broker:
  slippage:
    enabled: true
    base_bps: 5.0
    impact_bps_per_crore: 2.0
    max_bps: 25.0
partial_booking:
  enabled: true
  brokerage_buffer_pct: 0.05
  stage1_trigger_pct: 0.5
  stage1_book_pct: 0.0
  stage2_trigger_pct: 1.0
  stage2_book_pct: 25.0
  stage2_trail_pct: 0.5
  stage3_trigger_pct: 2.0
  stage3_book_pct: 30.0
  stage3_trail_pct: 0.8
  stage4_trigger_pct: 3.0
  stage4_book_pct: 45.0
  stage4_trail_pct: 1.0
